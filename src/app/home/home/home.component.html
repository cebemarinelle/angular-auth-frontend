<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card shadow">
        <div class="card-header bg-success text-white">
          <h3 class="mb-0">Welcome to Angular Auth Boilerplate</h3>
        </div>
        <div class="card-body text-center">
          <h1 class="display-4">Hi {{account?.firstName || account?.email}}!</h1>
          <p class="lead">You're logged in with Angular 21!</p>
          <hr>
          <div class="mt-4">
            <a routerLink="/profile" class="btn btn-primary me-2">View Profile</a>
            <a *ngIf="account?.role === 'Admin'" routerLink="/admin" class="btn btn-warning">Admin Panel</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
