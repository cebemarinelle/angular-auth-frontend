<div class="card shadow">
  <div class="card-header bg-primary text-white">
    <h3>{{isAddMode ? 'Create Account' : 'Edit Account'}}</h3>
  </div>
  <div class="card-body">
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="row">
        <div class="col-md-3 mb-3">
          <label class="form-label">Title</label>
          <select formControlName="title" class="form-select">
            <option value="">Select</option>
            <option value="Mr">Mr</option>
            <option value="Mrs">Mrs</option>
            <option value="Ms">Ms</option>
          </select>
        </div>
        <div class="col-md-4 mb-3">
          <label class="form-label">First Name</label>
          <input type="text" formControlName="firstName" class="form-control">
        </div>
        <div class="col-md-5 mb-3">
          <label class="form-label">Last Name</label>
          <input type="text" formControlName="lastName" class="form-control">
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" formControlName="email" class="form-control">
      </div>
      <div class="mb-3">
        <label class="form-label">Role</label>
        <select formControlName="role" class="form-select">
          <option value="">Select</option>
          <option value="User">User</option>
          <option value="Admin">Admin</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" formControlName="password" class="form-control">
        <small class="text-muted" *ngIf="!isAddMode">Leave blank to keep current password</small>
      </div>
      <div class="mb-3">
        <label class="form-label">Confirm Password</label>
        <input type="password" formControlName="confirmPassword" class="form-control">
      </div>
      <button type="submit" class="btn btn-primary">Save</button>
      <a routerLink="/admin/accounts" class="btn btn-secondary ms-2">Cancel</a>
    </form>
  </div>
</div>
